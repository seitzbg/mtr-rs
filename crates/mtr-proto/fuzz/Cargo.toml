# Its own workspace: the fuzz crate is deliberately outside the mtr-rs workspace
# (nightly-only deps), so `cargo check`/`cargo fuzz` work standalone here.
[workspace]

[package]
name = "mtr-proto-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mtr-proto = { path = ".." }

[[bin]]
name = "parse_request"
path = "fuzz_targets/parse_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_response"
path = "fuzz_targets/parse_response.rs"
test = false
doc = false
bench = false
