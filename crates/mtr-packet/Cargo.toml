[package]
name = "mtr-packet"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Privileged probe helper for mtr-rs, wire-compatible with mtr 0.96's mtr-packet"

[[bin]]
name = "mtr-rs-packet"
path = "src/main.rs"

[dependencies]
mtr-proto.workspace = true
thiserror.workspace = true
nix = { workspace = true, features = ["socket", "uio", "poll", "net", "user", "process", "fs"] }
socket2.workspace = true

# Linux capabilities: the privilege drop clears them and `mark` support asks after
# CAP_NET_ADMIN. FreeBSD and macOS have no equivalent; there the helper is setuid root and the
# drop is `setuid()` alone (see privs.rs).
[target.'cfg(target_os = "linux")'.dependencies]
caps.workspace = true
