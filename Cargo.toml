[workspace]
resolver = "3"
members = ["crates/mtr-proto", "crates/mtr-core", "crates/mtr", "crates/mtr-packet", "xtask"]
exclude = ["crates/mtr-proto/fuzz", "crates/mtr-packet/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
rust-version = "1.85"

[workspace.dependencies]
# The `version` is redundant for a path build but keeps these from reading as wildcard
# dependencies (see deny.toml `[bans] wildcards`), and crates.io would require it anyway.
mtr-proto = { path = "crates/mtr-proto", version = "0.1.0" }
mtr-core = { path = "crates/mtr-core", version = "0.1.0" }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal", "net"] }
clap = { version = "4", features = ["derive"] }
hickory-resolver = "0.26"
jiff = "0.2"
nix = { version = "0.31", features = ["hostname", "net", "user"] }
socket2 = { version = "0.6", features = ["all"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proptest = "1"
unicode-width = "0.2"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
insta = "1"
caps = "0.5"
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
clap_mangen = "0.3"
clap_complete = "4"
