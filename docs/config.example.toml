# mtr-rs configuration file — ~/.config/mtr-rs/config.toml
# ($XDG_CONFIG_HOME/mtr-rs/config.toml when XDG_CONFIG_HOME is set; --config PATH overrides both.)
#
# Precedence, lowest to highest:
#   built-in defaults  <  this file  <  $MTR_OPTIONS  <  the command line
#
# Every key is optional. A key still at its built-in default is shown commented out, with that
# default; a key you changed on the --init-config command line is written uncommented.

[display]
# The four upper bounds of the RTT colour ramp, in milliseconds: below the first is green, then
# yellow, magenta and red, and at or above the last, bold red. Same as --rtt-thresholds.
#rtt_thresholds_ms = [30, 100, 200, 500]
# The columns to show, using the field letters of -o.
#fields = "LS NABWV"
# ASCII glyphs and borders instead of Unicode ones (--ascii).
#ascii = false
# "auto" colours unless NO_COLOR is set, "always" colours even then, "never" is --no-color.
#color = "auto"
# Show the Recent sparkline column when the TUI starts (toggled with d).
#sparkline = true
# Open the detail pane when the TUI starts (toggled with Enter).
#detail_pane = true

[probe]
# Seconds between probe cycles (-i). Values below 1.0 need root.
#interval = 1.0
# Seconds to wait for late replies after the last cycle (-G).
#gracetime = 5.0
# The highest TTL probed (-m).
#max_ttl = 30
# Consecutive unanswered hops before the scan stops (-U).
#max_unknown = 12
# Seconds a probe may stay outstanding before it counts as lost (-Z).
#timeout = 10
# Resolve host names; false is -n.
#dns = true
# Look up origin AS numbers; true is -z.
#asn = false

[theme]
# The colour preset (--theme): "default" is the terminal's own ANSI palette; "dracula",
# "nord", "solarized" and "gruvbox" are RGB: reduced to 256 colours, or on a 16-colour terminal
# replaced by the terminal's palette role by role.
#preset = "default"
# One colour per role, replacing the preset's: a name ("green", "light red", "dark gray"),
# a 256-colour index ("208"), "#rrggbb", or "reset" for no colour. Shown: the preset's own.
#   ok / warn / bad / critical  the loss and RTT ramps, critical bold at the top
#   accent                      headers (bold), the prompt, the RTT chart
#   alert                       the status line and [PAUSED] (bold)
#   dim                         unknown hops, secondary rows, axes, footer hints
#   selected                    the selected row's background ("reset" reverses it)
#ok = "green"
#warn = "yellow"
#bad = "magenta"
#critical = "red"
#accent = "blue"
#alert = "yellow"
#dim = "reset"
#selected = "reset"
