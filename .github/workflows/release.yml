name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the artifacts but do not create or upload a release ("true"/"false")
        type: string
        default: "true"

# Least privilege: the build matrix only reads the repository. The publish job below
# raises this to `contents: write` for the single step that creates the release.
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            debarch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            debarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to master: the action normally infers the toolchain from its @rev, which
      # a commit SHA cannot express, so pass `toolchain` explicitly (see its README).
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - name: Check the tag matches the workspace version
        if: github.event_name == 'push'
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          tag=${GITHUB_REF_NAME#v}
          if [ "$version" != "$tag" ]; then
            echo "tag v$tag does not match workspace version $version" >&2
            exit 1
          fi
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-deb
      - name: Build the distribution layout
        run: |
          cargo xtask dist | tail -1 > dist-dir.txt
          cat dist-dir.txt
      - name: Allow unprivileged ping (DGRAM ICMP) sockets
        # The sanity check below runs mtr-rs-packet without cap_net_raw; GitHub runners default
        # ping_group_range to "1 0", which leaves the helper no socket to open at all.
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - name: Sanity-check the binaries
        run: |
          "$(cat dist-dir.txt)/bin/mtr-rs" --version
          printf '1 check-support feature version\n' | "$(cat dist-dir.txt)/bin/mtr-rs-packet"
      - name: Build and check the .deb
        run: scripts/check-deb.sh
      - name: Assemble artifacts
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p out
          dir="mtr-rs-${version}-${{ matrix.arch }}-linux"
          tar -C target/dist -czf "out/${dir}.tar.gz" "$dir"
          cp target/debian/mtr-rs_${version}-1_${{ matrix.debarch }}.deb out/
          ls -l out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mtr-rs-${{ matrix.arch }}
          path: out/*

  # macOS tarballs on GitHub's macOS runners: Apple silicon (`macos-latest`) and Intel
  # (`macos-15-intel`). No package format: the tarball plus `scripts/install.sh` (which makes
  # the helper setuid root) is the install path, as for FreeBSD without pkg.
  #
  # Signing and notarization need five secrets: APPLE_CERTIFICATE_P12 (base64 of the Developer
  # ID Application certificate with its key), APPLE_CERTIFICATE_PASSWORD, and for notarytool
  # APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID (an App Store Connect API key with
  # the Developer role). Without them the job warns and ships the binaries unsigned, as 0.3 did,
  # so a fork or a dry run still builds. Standalone executables cannot be stapled; Gatekeeper
  # looks the notarization ticket up online on first run, which is what removes the quarantine
  # prompt.
  build-macos:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - name: Check the tag matches the workspace version
        if: github.event_name == 'push'
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          tag=${GITHUB_REF_NAME#v}
          if [ "$version" != "$tag" ]; then
            echo "tag v$tag does not match workspace version $version" >&2
            exit 1
          fi
      - name: Build the distribution layout
        run: |
          cargo xtask dist | tail -1 > dist-dir.txt
          cat dist-dir.txt
      - name: Are the signing secrets configured?
        id: apple
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -n "$P12" ] && [ -n "$P12_PASSWORD" ] && [ -n "$API_KEY" ] && [ -n "$API_KEY_ID" ] && [ -n "$API_ISSUER" ]; then
            echo present=true >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Apple signing secrets are not all set; the macOS binaries ship unsigned"
            echo present=false >> "$GITHUB_OUTPUT"
          fi
      - name: Import the Developer ID certificate into a throwaway keychain
        if: steps.apple.outputs.present == 'true'
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$P12_PASSWORD" -f pkcs12 -A \
            -t cert -k "$keychain"
          rm -f "$RUNNER_TEMP/developer-id.p12"
          # The Developer ID G2 intermediate completes the chain; Xcode would install it.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          # Let codesign use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          [ -n "$identity" ] || { echo "no Developer ID Application identity in the .p12" >&2; exit 1; }
          echo "signing as: $identity"
          echo "identity=$identity" >> "$GITHUB_ENV"
          echo "keychain=$keychain" >> "$GITHUB_ENV"
      - name: Sign the binaries
        if: steps.apple.outputs.present == 'true'
        run: |
          set -euo pipefail
          for bin in mtr-rs mtr-rs-packet; do
            codesign --force --timestamp --options runtime --keychain "$keychain" \
              --sign "$identity" "$(cat dist-dir.txt)/bin/$bin"
            codesign --verify --strict --verbose=2 "$(cat dist-dir.txt)/bin/$bin"
          done
      - name: Notarize the binaries
        if: steps.apple.outputs.present == 'true'
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$API_KEY" > "$key"
          # notarytool takes a zip; the ticket is per code-signature, so the tarball's binaries
          # are covered by notarizing the same files here.
          ditto -c -k --keepParent "$(cat dist-dir.txt)/bin" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$key" --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER" --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json"
          cat "$RUNNER_TEMP/notary.json"
          status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/notary.json")
          id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/notary.json")
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$id" --key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" || true
            echo "notarization ended with status: $status" >&2
            exit 1
          fi
          rm -f "$key"
          # Gatekeeper's own verdict for a downloaded executable, now that the ticket exists.
          spctl --assess --type execute --verbose=2 "$(cat dist-dir.txt)/bin/mtr-rs"
      - name: Remove the signing keychain
        if: always() && steps.apple.outputs.present == 'true'
        run: |
          [ -n "${keychain:-}" ] && security delete-keychain "$keychain" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Sanity-check the binaries
        # Root, so the helper opens its raw sockets and answers. Runs after signing, so a
        # hardened-runtime signature that broke the binaries would fail here.
        run: |
          "$(cat dist-dir.txt)/bin/mtr-rs" --version
          printf '1 check-support feature version\n2 check-support feature ip-4\n' | sudo "$(cat dist-dir.txt)/bin/mtr-rs-packet"
          sudo "$(cat dist-dir.txt)/bin/mtr-rs" -r -c 1 127.0.0.1
      - name: Assemble artifacts
        run: |
          mkdir -p out
          dir=$(basename "$(cat dist-dir.txt)")
          tar -C target/dist -czf "out/${dir}.tar.gz" "$dir"
          ls -l out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mtr-rs-macos-${{ matrix.arch }}
          path: out/*

  # FreeBSD tarball and pkg(8) package, built inside a FreeBSD VM on the Ubuntu runner (see
  # ci.yml for why pkg's rust and not rustup). x86_64 only: GitHub has no runner that can
  # virtualise an aarch64 FreeBSD guest, and an emulated one took over an hour per release.
  # FreeBSD aarch64 builds from source (`scripts/build-freebsd-pkg.sh` works there) but ships
  # no binary.
  build-freebsd:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches the workspace version
        if: github.event_name == 'push'
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          tag=${GITHUB_REF_NAME#v}
          if [ "$version" != "$tag" ]; then
            echo "tag v$tag does not match workspace version $version" >&2
            exit 1
          fi
      - uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: "14.3"
          arch: ${{ matrix.arch }}
          mem: 8192
          cpu: 4
          prepare: |
            pkg install -y rust bash python3
          run: |
            set -e
            cargo xtask dist | tail -1 > dist-dir.txt
            cat dist-dir.txt
            # Sanity check: the VM shell is root, so the helper opens its raw sockets.
            "$(cat dist-dir.txt)/bin/mtr-rs" --version
            printf '1 check-support feature version\n' | "$(cat dist-dir.txt)/bin/mtr-rs-packet"
            pkgfile=$(sh scripts/build-freebsd-pkg.sh | tail -1)
            mkdir -p out
            dir=$(basename "$(cat dist-dir.txt)")
            tar -C target/dist -czf "out/${dir}.tar.gz" "$dir"
            cp "$pkgfile" "out/$(basename "$pkgfile" .pkg)-${{ matrix.arch }}-freebsd.pkg"
            ls -l out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mtr-rs-freebsd-${{ matrix.arch }}
          path: out/*

  # Split out of `build` so that only this job holds a write-scoped token. The condition
  # is the one the upload step carried before: tags only, and a `workflow_dispatch` run
  # publishes nothing unless it is explicitly told `dry_run: false`.
  #
  # Integrity: a `SHA256SUMS` asset (the checksums the Homebrew formula and the README's
  # verification step read) and a build-provenance attestation for every asset, so
  # `gh attestation verify <file> --repo seitzbg/mtr-rs` ties a download to this workflow run.
  # `id-token: write` mints the OIDC token that signs the attestation; `attestations: write`
  # stores it against the repository.
  publish:
    needs: [build, build-freebsd, build-macos]
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.dry_run != 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mtr-rs-*
          merge-multiple: true
          path: out
      - name: Checksums
        # Bare file names, so `sha256sum -c SHA256SUMS` works from the download directory.
        run: |
          cd out
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*
      - name: Upload to the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: out/*
          generate_release_notes: true

  # Point the Homebrew tap (seitzbg/homebrew-mtr-rs) at the release just published. Pushing to
  # another repository needs a token of its own: HOMEBREW_TAP_TOKEN, a fine-grained PAT scoped to
  # the tap with Contents read/write. Without it the step warns and the release stands as it is;
  # `scripts/homebrew-formula.sh <version>` then does the same by hand.
  homebrew:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.dry_run != 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Is the tap token configured?
        id: token
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo present=true >> "$GITHUB_OUTPUT"
          else
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the Homebrew tap was not updated"
            echo present=false >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          repository: seitzbg/homebrew-mtr-rs
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Regenerate the formula from the published tarballs and push it
        if: steps.token.outputs.present == 'true'
        run: |
          version=${GITHUB_REF_NAME#v}
          scripts/homebrew-formula.sh "$version" > tap/Formula/mtr-rs.rb
          cd tap
          git config user.name "Bryan Seitz"
          git config user.email "171158+seitzbg@users.noreply.github.com"
          git add Formula/mtr-rs.rb
          git diff --cached --quiet && { echo "formula already at $version"; exit 0; }
          git commit -m "mtr-rs $version"
          git push
