name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to master: the action normally infers the toolchain from its @rev, which
      # a commit SHA cannot express, so pass `toolchain` explicitly (see its README).
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Advisories, licences and sources (deny.toml)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - name: Allow unprivileged ping (DGRAM ICMP) sockets
        # GitHub-hosted runners give the job process neither cap_net_raw nor a gid inside
        # the default ping_group_range ("1 0", i.e. nobody), so mtr-rs-packet's raw-then-DGRAM
        # socket-open tests have no fallback available and would otherwise skip. Widening
        # the range lets the DGRAM path actually exercise on CI instead of only locally.
        if: runner.os == 'Linux'
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - run: cargo test --workspace
        env:
          INSTA_UPDATE: "no"
      # dpkg-deb (used by check-deb.sh) is in the base `dpkg` package; cargo-deb builds the
      # .deb itself, so no dpkg-dev, and nothing in this job calls setcap, so no libcap2-bin.
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-deb
      - run: cargo build --release --workspace
      - name: Generate the man pages and completions install.sh installs
        run: cargo xtask dist --no-build
      - name: install.sh round-trip
        run: scripts/tests/install-roundtrip.sh
      - name: Build and check the .deb
        run: scripts/check-deb.sh

  # The upstream Python helper suites (test/{cmdparse,param,probe}.py from the C repo)
  # run against our helper. The runner image ships a C `mtr-packet` at the wrapper's
  # default /usr/bin/mtr-packet, so the ours-vs-baseline comparison does cancel
  # environmental failures and only failures that are ours alone gate. We still split
  # the suites by how much signal each can carry on a runner:
  #   * cmdparse.py (TestCommandParse, which the wrapper selects) is hermetic — command
  #     parsing only, no network, no privilege — and param.py is local (127.0.0.1/::1
  #     against the raw-ICMP listener we build and setcap below, rebuilt at MIN_PORT so
  #     it is not on the known-divergence list). Both gate: `--compare` fails the job on
  #     any failure of ours.
  #   * probe.py gates too, on its IPv4 cases: they need the public internet (8.8.8.8),
  #     which runners have, and three consecutive runs of the compare step passed with
  #     no ours-only failures. Its remote IPv6 cases (Google's IPv6 DNS) are skipped by
  #     upstream's HAVE_IPV6 probe because GitHub runners have no IPv6, so they only run
  #     locally on a dual-stack box. Should a runner's network make this flaky, put the
  #     step back on --report-only rather than masking a real failure.
  helper-compat:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A second checkout puts the pinned upstream source beside this repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: traviscross/mtr
          ref: 7b017733aef06bb3d8e3573b2e964cc876644fad
          path: mtr-c
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: sudo apt-get install -y libcap2-bin
      - run: cargo build --workspace
      - run: sudo setcap cap_net_raw+ep target/debug/mtr-rs-packet
      - name: Build and empower the upstream raw-ICMP listener
        # packet_listen.c hard-codes SEQUENCE_NUM 33000, but MIN_PORT moved to 33434
        # in mtr 0.96, so patch a scratch copy (see run.sh --listen-seq).
        run: |
          sed 's/^#define SEQUENCE_NUM .*/#define SEQUENCE_NUM 33434/' \
            mtr-c/test/packet_listen.c > "$RUNNER_TEMP/packet_listen.c"
          cc -I mtr-c -o mtr-c/test/mtr-packet-listen "$RUNNER_TEMP/packet_listen.c"
          sudo setcap cap_net_raw+ep mtr-c/test/mtr-packet-listen
      - name: cmdparse + param (must pass)
        run: tests/compat/run.sh --compare cmdparse param
        env:
          MTR_PACKET: ${{ github.workspace }}/target/debug/mtr-rs-packet
          MTR_C_REPO: ${{ github.workspace }}/mtr-c
          # The listener above was compiled for our MIN_PORT, so param.py's four ids
          # come off the known-divergence list and gate (see run.sh --listen-seq).
          MTR_LISTEN_SEQUENCE: "33434"
      - name: probe (must pass; IPv4 cases need the public internet)
        run: tests/compat/run.sh --compare probe
        env:
          MTR_PACKET: ${{ github.workspace }}/target/debug/mtr-rs-packet
          MTR_C_REPO: ${{ github.workspace }}/mtr-c

  # macOS on GitHub's own runner (Apple silicon). Tests run under sudo so the helper opens real
  # raw sockets and the loopback probe tests execute; `sudo -E` keeps HOME, so the rustup proxy
  # and the cargo cache stay the runner user's. The privilege tests then see uid 0 = 0 = 0, which
  # is the same as the FreeBSD VM. Intel is release-only (see release.yml).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: sudo -E "$(command -v cargo)" test --workspace
        env:
          INSTA_UPDATE: "no"
      - run: cargo build --release --workspace
      - run: cargo xtask dist --no-build
      - run: scripts/tests/install-roundtrip.sh

  # FreeBSD, in a VM on the Ubuntu runner (GitHub has no FreeBSD runners). The VM's shell is
  # root, so mtr-rs-packet opens real raw sockets and the loopback probe tests run for real
  # rather than skipping as they do for the unprivileged Linux job. Rust comes from pkg(8):
  # rustup's FreeBSD support is x86_64 only and `rust-toolchain.toml` only steers rustup, so
  # the pkg toolchain is what a FreeBSD user gets too. python3 runs the fake helper the
  # client tests spawn (crates/mtr/tests/fake-mtr-packet.py). aarch64 is release-only (see
  # release.yml): the emulated VM is too slow for every push.
  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: "14.3"
          mem: 8192
          cpu: 4
          prepare: |
            pkg install -y rust bash python3
          run: |
            set -e
            cargo --version
            cargo clippy --workspace --all-targets -- -D warnings
            INSTA_UPDATE=no cargo test --workspace
            cargo build --release --workspace
            cargo xtask dist --no-build
            bash scripts/tests/install-roundtrip.sh
            sh scripts/build-freebsd-pkg.sh
