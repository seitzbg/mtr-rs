name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Allow unprivileged ping (DGRAM ICMP) sockets
        # GitHub-hosted runners give the job process neither cap_net_raw nor a gid inside
        # the default ping_group_range ("1 0", i.e. nobody), so mtr-packet's raw-then-DGRAM
        # socket-open tests have no fallback available and would otherwise skip. Widening
        # the range lets the DGRAM path actually exercise on CI instead of only locally.
        if: runner.os == 'Linux'
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - run: cargo test --workspace
        env:
          INSTA_UPDATE: "no"
      - name: Packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libcap2-bin dpkg-dev
          cargo install cargo-deb --locked
      - run: cargo build --release --workspace
      - name: Generate the man pages and completions install.sh installs
        run: cargo xtask dist --no-build
      - name: install.sh round-trip
        run: scripts/tests/install-roundtrip.sh
      - name: Build and check the .deb
        run: scripts/check-deb.sh

  # The upstream Python helper suites (test/{cmdparse,param,probe}.py from the C repo)
  # run against our helper. GitHub runners have no installed C `mtr-packet`, so the
  # wrapper's ours-vs-baseline comparison has no baseline to cancel environmental
  # failures against ("baseline: n/a") and every failure of ours counts. We therefore
  # split the suites by how much signal they can carry on a bare runner:
  #   * cmdparse.py (TestCommandParse, which the wrapper selects) is hermetic — command
  #     parsing only, no network, no privilege — and param.py is local (127.0.0.1/::1
  #     against the raw-ICMP listener we build and setcap below, rebuilt at MIN_PORT so
  #     it is not on the known-divergence list). Both gate: `--compare` fails the job on
  #     any failure of ours.
  #   * probe.py runs under --report-only: it needs the public internet (8.8.8.8,
  #     Google's IPv6 DNS), so its summary is in the log for inspection but does not
  #     gate. Install a C helper and set MTR_BASELINE to make it gating too.
  helper-compat:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: traviscross/mtr
          ref: 7b017733aef06bb3d8e3573b2e964cc876644fad
          path: mtr-c
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: sudo apt-get install -y libcap2-bin
      - run: cargo build --workspace
      - run: sudo setcap cap_net_raw+ep target/debug/mtr-packet
      - name: Build and empower the upstream raw-ICMP listener
        # packet_listen.c hard-codes SEQUENCE_NUM 33000, but MIN_PORT moved to 33434
        # in mtr 0.96, so patch a scratch copy (see run.sh --listen-seq).
        run: |
          sed 's/^#define SEQUENCE_NUM .*/#define SEQUENCE_NUM 33434/' \
            mtr-c/test/packet_listen.c > "$RUNNER_TEMP/packet_listen.c"
          cc -I mtr-c -o mtr-c/test/mtr-packet-listen "$RUNNER_TEMP/packet_listen.c"
          sudo setcap cap_net_raw+ep mtr-c/test/mtr-packet-listen
      - name: cmdparse + param (must pass)
        run: tests/compat/run.sh --compare cmdparse param
        env:
          MTR_PACKET: ${{ github.workspace }}/target/debug/mtr-packet
          MTR_C_REPO: ${{ github.workspace }}/mtr-c
          # The listener above was compiled for our MIN_PORT, so param.py's four ids
          # come off the known-divergence list and gate (see run.sh --listen-seq).
          MTR_LISTEN_SEQUENCE: "33434"
      - name: probe (report only, needs the public internet)
        run: tests/compat/run.sh --report-only probe
        env:
          MTR_PACKET: ${{ github.workspace }}/target/debug/mtr-packet
          MTR_C_REPO: ${{ github.workspace }}/mtr-c
