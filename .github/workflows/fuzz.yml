name: fuzz-build
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz build
        working-directory: crates/mtr-proto/fuzz
      - run: cargo fuzz run parse_request -- -max_total_time=60
        working-directory: crates/mtr-proto/fuzz
      - run: cargo fuzz run parse_response -- -max_total_time=60
        working-directory: crates/mtr-proto/fuzz
