name: fuzz-build
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # rust-toolchain.toml pins stable for the whole repo; cargo-fuzz needs nightly, and
    # RUSTUP_TOOLCHAIN outranks the file.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to master: the action normally infers the toolchain from its @rev, which
      # a commit SHA cannot express, so pass `toolchain` explicitly (see its README).
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz build
        working-directory: crates/mtr-proto/fuzz
      - run: cargo fuzz run parse_request -- -max_total_time=60
        working-directory: crates/mtr-proto/fuzz
      - run: cargo fuzz run parse_response -- -max_total_time=60
        working-directory: crates/mtr-proto/fuzz
      - run: cargo fuzz run decode_send_probe -- -max_total_time=60
        working-directory: crates/mtr-proto/fuzz
      - run: cargo fuzz build
        working-directory: crates/mtr-packet/fuzz
      - run: cargo fuzz run parse_icmp4 -- -max_total_time=60
        working-directory: crates/mtr-packet/fuzz
      - run: cargo fuzz run parse_icmp6 -- -max_total_time=60
        working-directory: crates/mtr-packet/fuzz
      - run: cargo fuzz run decode_mpls -- -max_total_time=60
        working-directory: crates/mtr-packet/fuzz
